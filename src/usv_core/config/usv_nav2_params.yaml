# USV 无静态地图导航参数配置 (基于里程计odom)
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom

    # 单点导航自定义行为树路径
    # default_nav_to_pose_bt_xml: "/home/orangepi/usv_ws/src/usv_core/config/usv_mapless_bt.xml"

    # 行为树节点插件列表
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_remove_passed_goals_action_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # 进度检查器：检测机器人是否停滞
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0
      
    # 目标到达检查器
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.3

    # DWB局部规划器 (双997有刷差速电机配置)
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # 动力学限制
      min_vel_x: -0.1
      max_vel_x: 0.8
      min_vel_y: 0.0
      max_vel_y: 0.0
      vy_samples: 0
      max_vel_theta: 0.8
      acc_lim_x: 0.3
      acc_lim_y: 0.0
      acc_lim_theta: 0.5
      decel_lim_x: -0.3
      
      # 速度采样与轨迹评分
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 2.0
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0

# 局部代价地图 (30m×30m滚动窗口)
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.05
      footprint: "[ [0.35, 0.15], [0.35, -0.15], [-0.35, -0.15], [-0.35, 0.15] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      
      # 障碍物层：激光雷达数据处理
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 11.0

      # 膨胀层：障碍物安全距离
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 1.0

# 全局代价地图 (100m×100m滚动窗口)
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 100
      height: 100
      resolution: 0.2
      footprint: "[ [0.35, 0.15], [0.35, -0.15], [-0.35, -0.15], [-0.35, 0.15] ]"
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      
      # 障碍物层：激光雷达数据处理
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 11.0

      # 膨胀层：障碍物安全距离
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.5 

# 全局路径规划器
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# 行为服务器：恢复行为配置
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    global_frame: odom
    robot_base_frame: base_link
    use_sim_time: false
    spin:
      plugin: "nav2_behaviors/Spin"
      simulate_ahead_time: 2.0
      max_rotational_vel: 0.5
    backup:
      plugin: "nav2_behaviors/BackUp"
      simulate_ahead_time: 2.0
      speed: -0.1
    wait:
      plugin: "nav2_behaviors/Wait"