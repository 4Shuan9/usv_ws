# USV Mapless Navigation Parameters (基于 odom 的无静态地图导航)

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom          # 无静态地图时，全局参考系设为 odom
    robot_base_frame: base_link
    odom_topic: /odom
    # 移除了所有依赖绝对定位(AMCL)的恢复节点，保留基础的路径跟随和等待
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_recovery_node_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0  # 水面环境动态变化相对较慢，10Hz 足够且节省 CPU
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0
      
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5    # 水面容易漂移，0.5米的容忍度比较合理
      yaw_goal_tolerance: 0.5

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # 动力学限制 (根据双997有刷差速电机配置)
      min_vel_x: -0.1           # 允许缓慢倒车脱困
      max_vel_x: 0.8
      min_vel_y: 0.0            # 差速船无法横移，Y轴速度彻底锁死
      max_vel_y: 0.0
      vy_samples: 0
      max_vel_theta: 0.8
      acc_lim_x: 0.3            # 水面阻力大且有惯性，加减速限制得平滑一些
      acc_lim_y: 0.0
      acc_lim_theta: 0.5
      decel_lim_x: -0.3
      
      # 采样与评分
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 2.0             # 预测未来2秒的轨迹，对高惯性的船体很重要
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0    # 匹配雷达的 10Hz
      publish_frequency: 2.0
      global_frame: odom        # 局部和全局的基准都是 odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true      # 滚动窗口模式，船体永远在地图中心
      width: 20                 # 局部感知范围 20x20 米
      height: 20
      resolution: 0.05
      # 船体多边形投影：长70cm(前35后35)，宽30cm(左15右15)
      footprint: "[ [0.35, 0.15], [0.35, -0.15], [-0.35, -0.15], [-0.35, 0.15] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0  # D6 雷达最大测距
          obstacle_max_range: 11.0  # 略小于最大测距以保证数据可靠性

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 1.0     # 障碍物膨胀半径，保证船体安全距离

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom        # Mapless核心：全局地图也用 odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true      # 无静态图，全局地图也必须随船滚动
      width: 50                 # 50x50米大窗口，用于宏观路径规划
      height: 50
      resolution: 0.2           # 分辨率设粗，极大节省香橙派算力
      footprint: "[ [0.35, 0.15], [0.35, -0.15], [-0.35, -0.15], [-0.35, 0.15] ]"
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 11.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 1.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false          # Dijkstra 算法通常在空旷水面表现更好
      allow_unknown: true       # 允许跨越雷达未扫到的"未知水域"规划航线

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    use_sim_time: false